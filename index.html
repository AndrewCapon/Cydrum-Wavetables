<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyDrums SystemCore.bin Editor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>CyDrums SystemCore.bin Editor</h1>
      <div class="header-controls">
        <label for="file-input" class="btn-file" title="Load SystemCore.bin">
          Choose File
          <input type="file" id="file-input" accept=".bin" hidden>
        </label>
        <select id="sample-rate-select" title="Sample rate for full wavetable updates">
          <option value="24000">24000 Hz</option>
          <option value="44100" selected>44100 Hz</option>
          <option value="384000">384000 Hz</option>
        </select>
        <button id="download-btn" disabled title="Download modified SystemCore.bin">Download</button>
        <select id="theme-select" class="theme-select" title="Choose theme" aria-label="Theme">
          <option value="light">☀️ Light</option>
          <option value="dark">🌙 Dark</option>
        </select>
      </div>

      <!-- Playback Controls Panel -->
      <div id="playback-panel" class="playback-panel">
        <button id="playback-toggle" class="playback-toggle" aria-expanded="false" aria-controls="playback-controls">
          Playback ▼
        </button>
        <div id="playback-controls" class="playback-controls" hidden>
          <div class="playback-row">
            <button id="play-btn" class="btn-play" disabled title="Play monophonic preview">▶ Play</button>
            <button id="stop-btn" class="btn-stop" disabled title="Stop playback" hidden>■ Stop</button>
            <label for="note-select">Note:</label>
            <select id="note-select" title="MIDI note for playback (C-1 to G9)">
              <!-- Options populated by JS -->
            </select>
            <span id="freq-display" class="freq-display">261.63 Hz</span>
          </div>
          <div class="playback-row">
            <label for="start-frame">Start Frame:</label>
            <input type="number" id="start-frame" min="0" max="255" value="0" title="Start frame (0-255)">
            <label for="end-frame">End Frame:</label>
            <input type="number" id="end-frame" min="0" max="255" value="255" title="End frame (0-255)">
            <label for="direction-select">Direction:</label>
            <select id="direction-select" title="Playback direction">
              <option value="forward">Forward</option>
              <option value="backward">Backward</option>
              <option value="forward-backward">Forward → Backward</option>
              <option value="backward-forward">Backward → Forward</option>
            </select>
          </div>
          <div class="playback-row">
            <label for="scan-speed-select">Scan Speed:</label>
            <select id="scan-speed-select" title="Wavetable scan speed">
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="1" selected>1x</option>
              <option value="2">2x</option>
              <option value="4">4x</option>
              <option value="8">8x</option>
            </select>
            <label class="checkbox-label">
              <input type="checkbox" id="interpolation-checkbox" checked title="Interpolate between frames">
              Interpolation
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="loop-checkbox" checked title="Loop playback">
              Loop
            </label>
          </div>
          <div class="playback-row midi-row">
            <label for="midi-input-select">MIDI Input:</label>
            <select id="midi-input-select" title="MIDI input device for polyphonic playback">
              <option value="">None</option>
              <!-- Options populated by Web MIDI API -->
            </select>
            <label class="checkbox-label">
              <input type="checkbox" id="midi-monitor-checkbox" title="Enable MIDI monitor mode (polyphonic)">
              Monitor
            </label>
            <label for="max-voices">Voices:</label>
            <input type="number" id="max-voices" min="1" max="32" value="8" title="Maximum polyphony (1-32)">
          </div>
        </div>
      </div>
    </header>
    <main>
      <aside id="wavetable-list" class="panel">
        <div class="panel-header">Wavetables (64)</div>
        <div id="wavetable-items" class="wavetable-items"></div>
      </aside>
      <section id="frame-view" class="panel">
        <div class="panel-header">
          <span id="selected-wt-name">Select a wavetable</span>
          <span id="selected-wt-info" class="wt-info"></span>
        </div>
        <div id="frame-grid" class="frame-grid"></div>
        <div id="no-selection" class="no-selection">Please choose a file</div>
      </section>
    </main>
    <div id="status-bar" class="status-bar">Ready. Load a SystemCore.bin file to begin.</div>
  </div>
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <div class="loading-text">Please wait, loading...</div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
